name: Supabase Admin Tasks

on:
  workflow_dispatch:

jobs:
  admin-tasks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Supabase Admin API example (create demo users)
        env:
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -e
          echo "Creating admin user via Supabase Admin API..."
          curl -s -X POST "$SUPABASE_URL/auth/v1/admin/users" \
            -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@mbg.io","password":"Admin123!","email_confirm":true}' | jq .

      - name: Example: use anon key in a build step (Flutter)
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          echo "This step demonstrates how to pass secrets into a build as dart-define."
          echo "flutter build commands would use: --dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
